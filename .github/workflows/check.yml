name: macOS arm64 source and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    # macOS arm64 is the first supported binary. Windows/Linux are unverified.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.10"
          enable-cache: false
      - name: Check native host and pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustc --version
      - name: Install locked dependencies on a clean checkout
        run: npm run bootstrap
      - name: Test source, frontend, native host, frozen sidecar and notices
        run: npm run check
      - name: Check native formatting and lint
        run: npm run native:lint
      - name: Build local macOS application with notice resources
        run: npm run tauri -- build --bundles app --target aarch64-apple-darwin -- --locked
      - name: Recheck the engine actually included in the application
        run: >-
          uv run --locked --project engine --group dev python scripts/verify_release.py
          --engine-binary src-tauri/target/aarch64-apple-darwin/release/bundle/macos/CVGnome.app/Contents/MacOS/cvgnome-engine
